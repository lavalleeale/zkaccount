[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
cache_path = "cache"
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
fs_permissions = [{ access = "read", path = "./contracts/test/fixtures" }]
